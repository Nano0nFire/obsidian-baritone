name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace @obsidian-sync/shared

      - name: Build server package
        run: npm run build --workspace @obsidian-sync/server

      - name: Typecheck plugin
        run: npm run typecheck --workspace obsidian-sync-plugin

      - name: Run tests
        run: npm test --workspaces --if-present

      - name: Run ESLint
        run: npm run lint --if-present
