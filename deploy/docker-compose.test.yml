# Throwaway infrastructure for server integration tests.
# Bring up:   docker compose -f deploy/docker-compose.test.yml up -d
# Tear down:  docker compose -f deploy/docker-compose.test.yml down -v
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: obsidian_sync_test
      POSTGRES_USER: obsidian_test
      POSTGRES_PASSWORD: obsidian_test_pw
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obsidian_test -d obsidian_sync_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio-test:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_test
      MINIO_ROOT_PASSWORD: minio_test_pw
    ports:
      - "19000:9000"
      - "19001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio-test-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    depends_on:
      minio-test:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio-test:9000 minio_test minio_test_pw;
      mc mb -p local/obsidian-sync-test || true;
      mc anonymous set none local/obsidian-sync-test;
      "
