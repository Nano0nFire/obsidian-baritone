# Generated for self-hosted Obsidian Sync. Copy .env.example to .env or run setup.sh.
services:
  server:
    build:
      context: ..
      dockerfile: packages/server/Dockerfile
    image: obsidian-sync-server:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    ports:
      - "${SERVER_PORT:-3000}:${SERVER_PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      minio-init:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:${SERVER_PORT:-3000}/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  migrate:
    image: obsidian-sync-server:latest
    build:
      context: ..
      dockerfile: packages/server/Dockerfile
    profiles: ["migrate"]
    restart: "no"
    env_file:
      - .env
    command: ["npm", "run", "migrate", "--workspace", "@obsidian-sync/server"]
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      minio-init:
        condition: service_completed_successfully
        required: false

  postgres:
    image: postgres:16-alpine
    profiles: ["bundled-db"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-obsidian_sync}
      POSTGRES_USER: ${POSTGRES_USER:-obsidian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - "${PG_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    profiles: ["bundled-minio"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-CHANGE_ME}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - "${MINIO_DATA_DIR:-./data/minio}:/data"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    profiles: ["bundled-minio"]
    restart: "no"
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb -p local/$${S3_BUCKET} || true;
      mc anonymous set none local/$${S3_BUCKET};
      "

  caddy:
    image: caddy:2.8-alpine
    profiles: ["tls-caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
      SERVER_PORT: ${SERVER_PORT:-3000}
    command: >
      caddy reverse-proxy --from ${CADDY_DOMAIN} --to server:${SERVER_PORT:-3000}
    depends_on:
      server:
        condition: service_started
